<div class="palette-picker" [ngStyle]="{'max-width.px':  numColumns* (squareSize + 6) -2   }">
  <div *ngFor="let color of colors" class="palette-container" [class.is-selected]="selectedColor === color">
    <div [ngStyle]="{'background-color': color, 'width.px': squareSize, 'height.px': squareSize}"
         class="palette-square"
         [class.is-selected]="selectedColor === color"
         (click)="selectColor(color)">
    </div>
  </div>
</div>
