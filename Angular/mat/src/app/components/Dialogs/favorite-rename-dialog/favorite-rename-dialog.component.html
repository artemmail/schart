<h2 mat-dialog-title>{{ data?.title || 'Переименовать избранное' }}</h2>

<div mat-dialog-content>
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Название</mat-label>
    <input
      matInput
      [(ngModel)]="name"
      (keydown.enter)="save()"
      autocomplete="off"
    />
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Отмена</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="!name.trim()">
    Сохранить
  </button>
</div>
