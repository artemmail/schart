<!-- seasonality.component.html -->


<mat-card>
  <mat-card-header>
    <mat-card-title>
      Сезонная активность
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    
      <app-ticker-autocomplete [(ngModel)]="ticker"
        (tickerChange)="onTickerSelected($event )"></app-ticker-autocomplete>


<div
  #chartHost
  class="seasonality-chart"
  (mousemove)="onChartMouseMove($event)"
  (mouseleave)="onChartMouseLeave()"
>
  <div [innerHTML]="chartHtml"></div>
  <div
    class="seasonality-tooltip"
    [class.seasonality-tooltip-hidden]="!tooltipVisible"
    [style.left.px]="tooltipLeft"
    [style.top.px]="tooltipTop"
    [style.width.px]="tooltipWidth"
    [style.height.px]="tooltipHeight"
  >
    <div class="seasonality-tooltip-body">
      <ng-template #tooltipHost></ng-template>
    </div>
  </div>
</div>

</mat-card-content>
</mat-card>
